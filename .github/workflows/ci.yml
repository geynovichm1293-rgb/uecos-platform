name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: uecos_user
          POSTGRES_PASSWORD: uecos_test_password
          POSTGRES_DB: uecos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uecos_user -d uecos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://uecos_user:uecos_test_password@localhost:5432/uecos_test
        run: npm run migrate
      - name: Run test suite
        env:
          DATABASE_URL: postgresql://uecos_user:uecos_test_password@localhost:5432/uecos_test
          JWT_SECRET: test-only-secret-for-ci-at-least-32-characters
          NODE_ENV: test
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: uecos-platform:ci
