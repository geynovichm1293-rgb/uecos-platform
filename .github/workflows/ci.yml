name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: uecos_user
          POSTGRES_PASSWORD: uecos_test_password
          POSTGRES_DB: uecos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uecos_user -d uecos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://uecos_user:uecos_test_password@localhost:5432/uecos_test
        run: npm run migrate
      - name: Seed test database
        env:
          DATABASE_URL: postgresql://uecos_user:uecos_test_password@localhost:5432/uecos_test
          JWT_SECRET: test-only-secret-for-ci-at-least-32-characters
          NODE_ENV: test
        run: npm run seed
      - name: Start API server
        env:
          DATABASE_URL: postgresql://uecos_user:uecos_test_password@localhost:5432/uecos_test
          JWT_SECRET: test-only-secret-for-ci-at-least-32-characters
          NODE_ENV: test
          PORT: 3000
        run: |
          npm start > /tmp/uecos-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              echo "API server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to become ready"
          cat /tmp/uecos-server.log
          exit 1
      - name: Run test suite
        env:
          DATABASE_URL: postgresql://uecos_user:uecos_test_password@localhost:5432/uecos_test
          JWT_SECRET: test-only-secret-for-ci-at-least-32-characters
          NODE_ENV: test
          API_BASE: http://127.0.0.1:3000
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: uecos-platform:ci
