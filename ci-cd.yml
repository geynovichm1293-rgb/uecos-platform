name: CI/CD Pipeline\n\non:\n  push:\n    branches: [ main, develop ]\n  pull_request:\n    branches: [ main, develop ]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    services:\n      postgres:\n        image: postgres:15-alpine\n        env:\n          POSTGRES_USER: uecos_user\n          POSTGRES_PASSWORD: uecos_password\n          POSTGRES_DB: uecos_test\n        options: >-\n          --health-cmd pg_isready\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5\n        ports:\n          - 5432:5432\n    steps:\n    - uses: actions/checkout@v3\n    - uses: actions/setup-node@v3\n      with:\n        node-version: '18'\n        cache: 'npm'\n    - run: npm ci\n    - run: DATABASE_URL=postgresql://uecos_user:uecos_password@localhost:5432/uecos_test npm run migrate\n    - run: npm test\n    - run: npm run test:security || true\n    - run: npm run test:accessibility || true\n    - uses: codecov/codecov-action@v3\n      if: always()\n\n  build:\n    runs-on: ubuntu-latest\n    needs: test\n    steps:\n    - uses: actions/checkout@v3\n    - uses: docker/setup-buildx-action@v2\n    - uses: docker/build-push-action@v4\n      with:\n        context: .\n        push: false\n        tags: uecos-platform:latest\n