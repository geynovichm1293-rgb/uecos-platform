version: '3.8'\nservices:\n  postgres:\n    image: postgres:15-alpine\n    container_name: uecos-postgres\n    environment:\n      POSTGRES_USER: uecos_user\n      POSTGRES_PASSWORD: uecos_password\n      POSTGRES_DB: uecos_dev\n    ports:\n      - \"5432:5432\"\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U uecos_user\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  app:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: uecos-app\n    environment:\n      NODE_ENV: development\n      DATABASE_URL: postgresql://uecos_user:uecos_password@postgres:5432/uecos_dev\n      JWT_SECRET: dev_secret_key_change_in_production\n      PORT: 3000\n    ports:\n      - \"3000:3000\"\n    depends_on:\n      postgres:\n        condition: service_healthy\n    volumes:\n      - ./src:/app/src\n      - ./scripts:/app/scripts\n    command: npm run dev\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3000/health\"]\n      interval: 10s\n      timeout: 5s\n      retries: 3\n\nvolumes:\n  postgres_data:\n